version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set a dedicated non-production value}
      POSTGRES_USER: ${POSTGRES_USER:?Set a dedicated non-production value}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated non-production value}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # optional rabbitmq for future message queue usage
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
