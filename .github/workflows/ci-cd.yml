name: Django CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Isolated PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with disposable credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import sys
          import time

          # Credentials stay in process memory, never GitHub step outputs,
          # GITHUB_ENV, command arguments, logs, or repository secrets.
          env = {
              key: value for key, value in os.environ.items()
              if not key.startswith(("POSTGRES_", "NEXUS_", "DJANGO_"))
              and key not in {"DATABASE_URL", "TESTING", "RENDER"}
          }
          username = "nexus_test_" + secrets.token_hex(6)
          password = secrets.token_urlsafe(32)
          env.update({
              "DJANGO_SETTINGS_MODULE": "alx_project_nexus.settings_test",
              "NEXUS_TEST_SECRET_KEY": secrets.token_urlsafe(64),
              "NEXUS_TEST_DB_HOST": "127.0.0.1",
              "NEXUS_TEST_DB_PORT": "5432",
              "NEXUS_TEST_DB_NAME": "nexus_test_ci",
              "NEXUS_TEST_DB_USER": username,
              "NEXUS_TEST_DB_PASSWORD": password,
              "POSTGRES_DB": "nexus_test_ci",
              "POSTGRES_USER": username,
              "POSTGRES_PASSWORD": password,
              "PYTHONDONTWRITEBYTECODE": "1",
          })
          container = (
              "nexus-ci-" + os.environ["GITHUB_RUN_ID"]
              + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          try:
              subprocess.run([
                  "docker", "run", "--detach", "--name", container,
                  "--publish", "127.0.0.1:5432:5432",
                  "--env", "POSTGRES_DB", "--env", "POSTGRES_USER",
                  "--env", "POSTGRES_PASSWORD", "postgres:15",
              ], env=env, check=True, stdout=subprocess.DEVNULL)
              for attempt in range(60):
                  ready = subprocess.run([
                      "docker", "exec", container, "sh", "-c",
                      'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"',
                  ], check=False, capture_output=True)
                  if ready.returncode == 0:
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("Disposable PostgreSQL did not become ready.")
              # pytest-django applies migrations only to the disposable test DB.
              subprocess.run([
                  sys.executable, "-B", "-m", "pytest",
                  "-p", "no:cacheprovider",
              ], env=env, check=True)
          finally:
              subprocess.run([
                  "docker", "rm", "--force", container,
              ], check=False, stdout=subprocess.DEVNULL,
                 stderr=subprocess.DEVNULL)
          PY

      - name: Lint backend paths
        if: always()
        run: python -m flake8 --extend-exclude "*/migrations/*" accounts polls alx_project_nexus manage.py
