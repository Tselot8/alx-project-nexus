name: Project Nexus release verification

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Isolated PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Offline production and current-source secret gates
        run: |
          python -B scripts/check_release.py
          python -B scripts/audit_secrets.py

      - name: Run tests with disposable credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import sys
          import time

          # Credentials stay in process memory, never GitHub step outputs,
          # GITHUB_ENV, command arguments, logs, or repository secrets.
          env = {
              key: value for key, value in os.environ.items()
              if not key.startswith(("POSTGRES_", "NEXUS_", "DJANGO_"))
              and key not in {"DATABASE_URL", "TESTING", "RENDER"}
          }
          username = "nexus_test_" + secrets.token_hex(6)
          password = secrets.token_urlsafe(32)
          env.update({
              "DJANGO_SETTINGS_MODULE": "alx_project_nexus.settings_test",
              "NEXUS_TEST_SECRET_KEY": secrets.token_urlsafe(64),
              "NEXUS_TEST_DB_HOST": "127.0.0.1",
              "NEXUS_TEST_DB_PORT": "5432",
              "NEXUS_TEST_DB_NAME": "nexus_test_ci",
              "NEXUS_TEST_DB_USER": username,
              "NEXUS_TEST_DB_PASSWORD": password,
              "POSTGRES_DB": "nexus_test_ci",
              "POSTGRES_USER": username,
              "POSTGRES_PASSWORD": password,
              "PYTHONDONTWRITEBYTECODE": "1",
          })
          container = (
              "nexus-ci-" + os.environ["GITHUB_RUN_ID"]
              + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          try:
              subprocess.run([
                  "docker", "run", "--detach", "--name", container,
                  "--publish", "127.0.0.1:5432:5432",
                  "--env", "POSTGRES_DB", "--env", "POSTGRES_USER",
                  "--env", "POSTGRES_PASSWORD", "postgres:15",
              ], env=env, check=True, stdout=subprocess.DEVNULL)
              for attempt in range(60):
                  ready = subprocess.run([
                      "docker", "exec", container, "sh", "-c",
                      'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"',
                  ], check=False, capture_output=True)
                  if ready.returncode == 0:
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("Disposable PostgreSQL did not become ready.")
              # pytest-django applies migrations only to the disposable test DB.
              subprocess.run([
                  sys.executable, "-B", "-m", "pytest",
                  "-p", "no:cacheprovider",
              ], env=env, check=True)
          finally:
              subprocess.run([
                  "docker", "rm", "--force", container,
              ], check=False, stdout=subprocess.DEVNULL,
                 stderr=subprocess.DEVNULL)
          PY

      - name: Lint backend paths
        if: always()
        run: python -m flake8 --extend-exclude "*/migrations/*" accounts polls alx_project_nexus manage.py scripts integration

  frontend:
    name: Frontend lint tests types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify locked frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

  fullstack:
    name: Disposable HTTP browser and accessibility verification
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
      - name: Install test prerequisites
        run: |
          python -m pip install -r requirements.txt
          docker pull postgres:15
          google-chrome --version
      - name: Verify isolated full stack
        run: python -B scripts/verify_fullstack.py

  staging_artifact:
    name: Offline production artifact smoke
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify local image without cloud or database access
        run: python -B scripts/verify_staging.py
